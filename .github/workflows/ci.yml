# km 持续检查。
#
# - verify：格式 / vet / 单测 / race / build（不需要 Docker）。
# - integration：独立作业，需要真实 Docker 引擎与本地构建的最小镜像
#   （ubuntu runner 自带 Docker；镜像在作业内显式构建，前提缺失时作业失败，
#   不把「未执行」当成功）。首个验证平台是 macOS（本地）；本作业先跑在
#   linux/amd64 上，平台差异以套件实际结果为准。
#
# 注意：远端 CI 在首次 push 前不会运行（本仓库遵循「不自动 push」约定）。
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: gofmt 检查
        run: test -z "$(gofmt -l . )" || { echo "未格式化文件:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: 单测
        run: go test -count=1 ./...
      - name: 单测（race）
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...

  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Docker 引擎预检（不可达必须失败）
        run: docker info
      - name: 构建最小镜像（集成前提）
        run: docker build -t kali-mac-min:0.2 images/kali
      - name: 集成套件
        run: go test -tags=integration -count=1 -timeout 15m -v ./tests/integration/
