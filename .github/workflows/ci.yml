# km 持续检查。
#
# - verify：格式 / vet / 单测 / race / build（不需要 Docker）。
# - integration：独立作业，需要真实 Docker 引擎与本地构建的最小镜像
#   （ubuntu runner 自带 Docker；镜像在作业内显式构建，前提缺失时作业失败，
#   不把「未执行」当成功）。首个验证平台是 macOS（本地）；本作业先跑在
#   linux/amd64 上，平台差异以套件实际结果为准。
#
# 注意：远端 CI 在首次 push 前不会运行（本仓库遵循「不自动 push」约定）。
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: gofmt 检查
        run: test -z "$(gofmt -l . )" || { echo "未格式化文件:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: 单测
        run: go test -count=1 ./...
      - name: 单测（race）
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...
      - name: 打包一致性冒烟（版本源=当前源码；过期 bin/km 与任意 cwd 无影响）
        run: |
          want="$(go run ./cmd/km --version | awk '{print $2}')"
          mkdir -p bin
          printf '#!/bin/sh\necho "km 9.9.9-stale"\n' > bin/km
          chmod +x bin/km
          got="$("$GITHUB_WORKSPACE/bin/km" --version)"
          test "$got" = "km 9.9.9-stale"   # 假二进制场景必须真实建立
          cd /tmp
          bash "$GITHUB_WORKSPACE/scripts/package.sh" > pkg.out
          grep -q "^version: $want$" pkg.out
          grep -q "^worktree: " pkg.out
          test -f "$GITHUB_WORKSPACE/dist/km-$want-darwin-amd64"
          test -f "$GITHUB_WORKSPACE/dist/km-$want-darwin-arm64"

  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Docker 引擎预检（不可达必须失败）
        run: docker info
      - name: 预拉取官方基础/工具镜像（CI 不经国内镜像站）
        run: |
          docker pull kalilinux/kali-rolling:latest
          docker pull busybox:stable
      - name: 构建最小镜像（官方基础镜像 + 官方 apt CDN）
        # apt 用 http 而非 https：kali-rolling 基础镜像的 CA 信任库在 runner
        # 容器内对 CDN 的 TLS 校验失败（首次 CI 实测 certificate verify failed）；
        # apt 完整性由 Release 签名（Signed-By 密钥）保证，不依赖传输加密。
        run: |
          docker build \
            --build-arg KALI_BASE=kalilinux/kali-rolling:latest \
            --build-arg KALI_APT_MIRROR=http://kali.download/kali/ \
            -t kali-mac-min:0.2 images/kali
      - name: 集成套件
        env:
          KM_TEST_TOOL_IMAGE: kalilinux/kali-rolling:latest
          KM_TEST_DRIFT_IMAGE: busybox:stable
        run: go test -tags=integration -count=1 -timeout 15m -v ./tests/integration/
